name: Lint on Push

on:
  push:
    branches: [main, master] # ou outro nome da tua branch principal
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # ou a versão do teu projeto

      - name: Install dependencies
        run: npm ci # ou npm install

      - name: Run ESLint
        run: npx eslint . --ext .js,.ts,.jsx,.tsx
